          </div>
        </div>
        <div>
          <label class="text-xs font-medium mb-1.5 block" style="color: var(--text-muted)">Descrição (markdown)</label>
          <textarea class="input mono text-xs" id="u-desc" rows="6" placeholder="O que foi feito, decisões, contexto...">${escape(u?.description || '')}</textarea>
        </div>

        ${projectTasks.length > 0 ? `
          <div>
            <label class="text-xs font-medium mb-1.5 block" style="color: var(--text-muted)">Vincular tarefas (opcional)</label>
            <div class="card p-2 max-h-40 overflow-y-auto">
              ${projectTasks.map(t => `
                <label class="flex items-center gap-2 px-2 py-1 rounded cursor-pointer hover:bg-black/20 text-xs">
                  <input type="checkbox" name="link-task" value="${t.id}" ${linkedIds.has(t.id) ? 'checked' : ''}>
                  <span>${escape(t.title)}</span>
                  <span class="ml-auto text-[10px]" style="color: var(--text-dim)">${STATUS_LABELS[t.status]}</span>
                </label>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${u ? `
          <div>
            <label class="text-xs font-medium mb-1.5 block" style="color: var(--text-muted)">Anexos</label>
            <div id="update-atts" class="flex flex-wrap gap-2 mb-2"></div>
            <div class="drop-zone" id="update-drop">📎 Clique ou arraste PDFs/arquivos aqui</div>
            <input type="file" id="update-file-input" class="hidden" multiple>
          </div>
        ` : `
          <div class="text-xs px-3 py-2 rounded" style="background: var(--bg-elev); color: var(--text-muted); border: 1px solid var(--border)">
            💡 Salve a atualização primeiro pra anexar arquivos
          </div>
        `}

        <div class="flex gap-2 pt-3">
          ${u ? `<button type="button" class="btn btn-danger" onclick="confirmDeleteUpdate('${u.id}')">Apagar</button>` : ''}
          <button type="button" class="btn btn-secondary ${u ? '' : 'flex-1'}" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary flex-1">${u ? 'Salvar' : 'Criar'}</button>
        </div>
      </form>
    </div>
  `, true);

  $('#u-title').focus();

  if (u) {
    renderUpdateAttachments(u.id);
    setupDropZone($('#update-drop'), $('#update-file-input'), async (files) => {
      for (const f of files) {
        await uploadFile(f, { update_id: u.id });
      }
      const { data: atts } = await sb.from('attachments').select('*').eq('update_id', u.id);
      state.attachments = (state.attachments || []).filter(a => a.update_id !== u.id).concat(atts || []);
      renderUpdateAttachments(u.id);
    });
  }

  $('#update-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const linkedTaskIds = Array.from(document.querySelectorAll('input[name="link-task"]:checked')).map(el => el.value);
    const payload = {
      project_id: pid,
      title: $('#u-title').value,
      description: $('#u-desc').value || null,
      update_type: $('#u-type').value,
      released_at: $('#u-date').value,
      linked_task_ids: linkedTaskIds,
    };
    if (u) {
      await updateUpdate(u.id, payload);
    } else {
      const newU = await createUpdate(payload);
      if (newU) {
        await loadUpdates(pid);
        renderCurrentView();
        closeModal();
        setTimeout(() => openUpdateModal(newU.id, pid), 100);
        return;
      }
    }
    await loadUpdates(pid);
    renderCurrentView();
    closeModal();
  });
}

function renderUpdateAttachments(updateId) {
  const el = $('#update-atts');
  if (!el) return;
  const atts = (state.attachments || []).filter(a => a.update_id === updateId);
  if (atts.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = atts.map(a => `
    <div class="flex items-center gap-1">
      <a href="${attachmentUrl(a.file_path)}" target="_blank" class="file-chip">
        <span>${fileIcon(a.mime_type)}</span>
        <span class="file-name">${escape(a.file_name)}</span>
        <span class="file-size">${formatBytes(a.file_size)}</span>
      </a>
      ${a.uploaded_by === state.user.id ? `<button type="button" class="btn-ghost p-1 rounded" onclick="removeUpdateAtt('${a.id}', '${updateId}')" title="Remover"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>` : ''}
    </div>
  `).join('');
}

async function removeUpdateAtt(attId, updateId) {
  const att = state.attachments.find(a => a.id === attId);
  if (!att) return;
  await deleteAttachment(att);
  state.attachments = state.attachments.filter(a => a.id !== attId);
  renderUpdateAttachments(updateId);
}

async function confirmDeleteUpdate(id) {
  if (!confirm('Apagar essa atualização? Os anexos também serão removidos.')) return;
  const atts = state.attachments.filter(a => a.update_id === id);
  for (const a of atts) {
    await sb.storage.from(BUCKET).remove([a.file_path]);
  }
  await deleteUpdate(id);
  renderCurrentView();
  closeModal();
}

// Drop zone
function setupDropZone(zone, fileInput, onFiles) {
  if (!zone) return;
  zone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    if (e.target.files.length > 0) {
      const originalText = zone.textContent;
      zone.innerHTML = '<span class="spinner"></span> Enviando...';
      await onFiles(Array.from(e.target.files));
      zone.textContent = originalText;
      fileInput.value = '';
      toast('Arquivos enviados', 'success');
    }
  });
  zone.addEventListener('dragover', (e) => {
    e.preventDefault();
    zone.classList.add('dragover');
  });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', async (e) => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      const originalText = zone.textContent;
      zone.innerHTML = '<span class="spinner"></span> Enviando...';
      await onFiles(Array.from(e.dataTransfer.files));
      zone.textContent = originalText;
      toast('Arquivos enviados', 'success');
    }
  });
}

// CMD+K
let cmdkSelectedIndex = 0;
let cmdkResults = [];

function openCmdK() {
  const root = $('#cmdk-root');
  root.innerHTML = `
    <div class="cmdk-backdrop" id="cmdk-backdrop">
      <div class="cmdk" onclick="event.stopPropagation()">
        <input class="cmdk-input" id="cmdk-input" placeholder="Buscar projetos, tarefas, notas, ideias, atualizações..." autocomplete="off">
        <div class="cmdk-results" id="cmdk-results"></div>
        <div class="cmdk-hint">
          <span><kbd>↑↓</kbd> navegar</span>
          <span><kbd>↵</kbd> abrir</span>
          <span><kbd>esc</kbd> fechar</span>
        </div>
      </div>
    </div>
  `;
  $('#cmdk-backdrop').addEventListener('click', closeCmdK);
  const input = $('#cmdk-input');
  input.focus();
  input.addEventListener('input', renderCmdKResults);
  input.addEventListener('keydown', cmdkKeyDown);
  renderCmdKResults();
}

function closeCmdK() {
  $('#cmdk-root').innerHTML = '';
}

let cmdkIndex = { allNotes: [], allUpdates: [], allArchs: [] };

async function refreshCmdKIndex() {
  const { data: allNotes } = await sb.from('notes').select('id, title, project_id, content, category');
  const { data: allUpdates } = await sb.from('project_updates').select('id, title, project_id, description, update_type');
  const { data: allArchs } = await sb.from('architectures').select('id, title, project_id, diagram_type');
  cmdkIndex = { allNotes: allNotes || [], allUpdates: allUpdates || [], allArchs: allArchs || [] };
}

function renderCmdKResults() {
  const q = $('#cmdk-input').value.toLowerCase().trim();
  const root = $('#cmdk-results');

  if (!q) {
    const items = state.projects.slice(0, 6).map(p => ({
      type: 'project', id: p.id, label: p.name, meta: 'Projeto', color: p.color
    }));
    cmdkResults = items;
    root.innerHTML = items.length === 0 ? `<div class="cmdk-empty">Comece a digitar para buscar</div>` : `
      <div class="cmdk-section-label">Projetos</div>
      ${items.map((it, i) => cmdkItemHTML(it, i)).join('')}
    `;
    cmdkSelectedIndex = 0;
    highlightCmdK();
    attachCmdKListeners();
    return;
  }

  const results = [];
  state.projects.forEach(p => {
    if (p.name.toLowerCase().includes(q) || p.description?.toLowerCase().includes(q)) {
      results.push({ type: 'project', id: p.id, label: p.name, meta: 'Projeto', color: p.color });
    }
  });
  state.tasks.forEach(t => {
    if (t.title.toLowerCase().includes(q) || t.description?.toLowerCase().includes(q)) {
      const proj = state.projects.find(p => p.id === t.project_id);
      results.push({ type: 'task', id: t.id, label: t.title, meta: proj?.name || 'Tarefa', color: proj?.color });
    }
  });
  state.ideas.forEach(i => {
    if (i.title.toLowerCase().includes(q) || i.description?.toLowerCase().includes(q)) {
      results.push({ type: 'idea', id: i.id, label: i.title, meta: 'Ideia' });
    }
  });
  cmdkIndex.allNotes.forEach(n => {
    if (n.title.toLowerCase().includes(q) || n.content?.toLowerCase().includes(q)) {
      const proj = state.projects.find(p => p.id === n.project_id);
      results.push({ type: 'note', id: n.id, projectId: n.project_id, label: n.title, meta: `Nota · ${proj?.name || ''}`, color: proj?.color });
    }
  });
  cmdkIndex.allUpdates.forEach(u => {
    if (u.title.toLowerCase().includes(q) || u.description?.toLowerCase().includes(q)) {
      const proj = state.projects.find(p => p.id === u.project_id);
      results.push({ type: 'update', id: u.id, projectId: u.project_id, label: u.title, meta: `Atualização · ${proj?.name || ''}`, color: proj?.color });
    }
  });
  (cmdkIndex.allArchs || []).forEach(ar => {
    if (ar.title.toLowerCase().includes(q)) {
      const proj = state.projects.find(p => p.id === ar.project_id);
      results.push({ type: 'arch', id: ar.id, projectId: ar.project_id, label: ar.title, meta: `Arquitetura · ${proj?.name || ''}`, color: proj?.color });
    }
  });

  cmdkResults = results.slice(0, 30);
  cmdkSelectedIndex = 0;

  if (cmdkResults.length === 0) {
    root.innerHTML = `<div class="cmdk-empty">Nada encontrado pra "${escape(q)}"</div>`;
    return;
  }

  const grouped = {};
  cmdkResults.forEach((r, idx) => {
    const k = r.type;
    if (!grouped[k]) grouped[k] = [];
    grouped[k].push({ ...r, _idx: idx });
  });
  const labels = { project: 'Projetos', task: 'Tarefas', idea: 'Ideias', note: 'Notas', update: 'Atualizações', arch: 'Arquitetura' };
  root.innerHTML = Object.entries(grouped).map(([k, items]) => `
    <div class="cmdk-section-label">${labels[k]}</div>
    ${items.map(it => cmdkItemHTML(it, it._idx)).join('')}
  `).join('');
  highlightCmdK();
  attachCmdKListeners();
}

function cmdkItemHTML(item, idx) {
  const icon = { project: '📁', task: '✓', idea: '💡', note: '📝', update: '🚀', arch: '◇' }[item.type] || '·';
  return `
    <div class="cmdk-item" data-idx="${idx}">
      ${item.color ? `<span class="proj-dot" style="background: ${item.color}"></span>` : `<span style="font-size: 14px">${icon}</span>`}
      <span class="truncate">${escape(item.label)}</span>
      <span class="cmdk-item-meta">${escape(item.meta)}</span>
    </div>
  `;
}

function highlightCmdK() {
  document.querySelectorAll('.cmdk-item').forEach((el, i) => {
    el.classList.toggle('selected', parseInt(el.dataset.idx) === cmdkSelectedIndex);
  });
}

function attachCmdKListeners() {
  document.querySelectorAll('.cmdk-item').forEach(el => {
    el.addEventListener('click', () => {
      cmdkSelectedIndex = parseInt(el.dataset.idx);
      cmdkOpen();
    });
    el.addEventListener('mouseenter', () => {
      cmdkSelectedIndex = parseInt(el.dataset.idx);
      highlightCmdK();
    });
  });
}

function cmdkKeyDown(e) {
  if (e.key === 'Escape') { e.preventDefault(); closeCmdK(); }
  else if (e.key === 'ArrowDown') {
    e.preventDefault();
    cmdkSelectedIndex = Math.min(cmdkSelectedIndex + 1, cmdkResults.length - 1);
    highlightCmdK();
    document.querySelector('.cmdk-item.selected')?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    cmdkSelectedIndex = Math.max(cmdkSelectedIndex - 1, 0);
    highlightCmdK();
    document.querySelector('.cmdk-item.selected')?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    cmdkOpen();
  }
}

function cmdkOpen() {
  const item = cmdkResults[cmdkSelectedIndex];
  if (!item) return;
  closeCmdK();
  setTimeout(() => {
    if (item.type === 'project') navigate(`project/${item.id}`);
    else if (item.type === 'task') openTaskModal(item.id);
    else if (item.type === 'idea') openIdeaModal(item.id);
    else if (item.type === 'note') {
      navigate(`project/${item.projectId}/notes`);
      setTimeout(() => openNoteModal(item.id, item.projectId), 200);
    } else if (item.type === 'update') {
      navigate(`project/${item.projectId}/updates`);
      setTimeout(() => openUpdateModal(item.id, item.projectId), 200);
    } else if (item.type === 'arch') {
      navigate(`project/${item.projectId}/architecture`);
      setTimeout(() => openArchModal(item.id, item.projectId), 250);
    }
  }, 50);
}

$('#btn-cmdk').addEventListener('click', async () => {
  await refreshCmdKIndex();
  openCmdK();
});

$('#btn-new-project').addEventListener('click', () => openProjectModal());
$('#btn-quick-add').addEventListener('click', () => openTaskModal());

document.addEventListener('keydown', async (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    await refreshCmdKIndex();
    openCmdK();
    return;
  }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (document.querySelector('.modal-backdrop') || document.querySelector('.cmdk-backdrop')) return;
  if (e.key === 'c' || e.key === 'C') {
    e.preventDefault();
    openTaskModal();
  } else if (e.key === 'g') {
    document.addEventListener('keydown', (e2) => {
      if (e2.key === 't') navigate('today');
      if (e2.key === 'i') navigate('ideas');
    }, { once: true });
  }
});

// Expose
window.openProjectModal = openProjectModal;
window.openTaskModal = openTaskModal;
window.openIdeaModal = openIdeaModal;
window.openNoteModal = openNoteModal;
window.openUpdateModal = openUpdateModal;
window.openArchModal = openArchModal;
window.confirmDeleteArch = confirmDeleteArch;
window.confirmDeleteProject = confirmDeleteProject;
window.confirmDeleteTask = confirmDeleteTask;
window.confirmDeleteIdea = confirmDeleteIdea;
window.confirmDeleteNote = confirmDeleteNote;
window.confirmDeleteUpdate = confirmDeleteUpdate;
window.confirmLeaveProject = confirmLeaveProject;
window.removeTaskAtt = removeTaskAtt;
window.removeUpdateAtt = removeUpdateAtt;
window.removeComment = removeComment;
window.closeModal = closeModal;
window.handleRoleChange = handleRoleChange;
window.handleRemoveMember = handleRemoveMember;
window.handleCancelInvite = handleCancelInvite;
window.navigate = navigate;

init();
</script>
